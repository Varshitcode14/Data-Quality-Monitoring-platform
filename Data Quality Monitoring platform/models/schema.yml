version: 2

models:

  - name: dim_customers
    description: Customer dimension table

    columns:
      - name: customer_id
        description: Unique customer identifier
        tests:
          - unique
          - not_null

      - name: email
        description: Customer email address
        tests:
          - not_null
          - unique

  - name: dim_products
    description: Product dimension table

    columns:
      - name: product_id
        description: Unique product identifier
        tests:
          - unique
          - not_null

  - name: fct_orders
    description: Order fact table

    columns:
      - name: order_id
        description: Unique order identifier
        tests:
          - not_null

      - name: customer_id
        description: Customer identifier
        tests:
          - not_null

      - name: order_status
        description: Order status

        tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - completed
                  - pending
                  - cancelled

  - name: stg_payments
    description: Staging payments table

    columns:
      - name: payment_id
        description: Unique payment identifier
        tests:
          - not_null

      - name: payment_amount
        description: Payment amount
        tests:
          - not_null

  - name: fct_sales
    description: Sales fact table

    columns:
      - name: order_id
        description: Order identifier
        tests:
          - not_null

      - name: product_id
        description: Product identifier
        tests:
          - not_null

      - name: revenue
        description: Revenue generated by product sale
        tests:
          - not_null
   